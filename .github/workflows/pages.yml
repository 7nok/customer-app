name: GitHub Pages

on:
  push:
    branches: [A, cursor/preview-switcher-1624]
  pull_request:
  workflow_dispatch:

# actions/deploy-pages mints an OIDC token. These must be granted at
# workflow scope and again on the deploy job — a job-level permissions
# block replaces (does not inherit) the workflow block.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch design sources
        run: |
          git fetch --no-tags origin A B C
          git fetch --no-tags origin cursor/dock-first-paint-b-5301 cursor/dock-first-paint-c-5301 || true
          git fetch --no-tags origin cursor/daily-drivin-hero-b-5301 cursor/daily-drivin-hero-c-5301 || true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Preview routing tests
        run: npm run test:preview

      - name: Export A, B, and C into one site
        run: node scripts/assemble-preview.mjs --typecheck

      - name: Setup Pages
        if: >-
          (github.ref == 'refs/heads/A' || github.ref == 'refs/heads/cursor/preview-switcher-1624') &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: >-
          (github.ref == 'refs/heads/A' || github.ref == 'refs/heads/cursor/preview-switcher-1624') &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: >-
      (github.ref == 'refs/heads/A' || github.ref == 'refs/heads/cursor/preview-switcher-1624') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: export-web
    runs-on: ubuntu-latest
    concurrency:
      group: pages-preview
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    # The repo's github-pages environment only allows `main`. Deploy without
    # that protected environment so the preview site can publish.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
