name: GitHub Pages

on:
  push:
    branches: [B]
  pull_request:
  workflow_dispatch:

# Export-only. Live Pages is the A/B/C switcher site (see PREVIEW.md on A).
# A push to B must not overwrite that combined deploy.
permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Export Expo static website
        run: npx expo export --platform web

      - name: GitHub Pages extras
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
