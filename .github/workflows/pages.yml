name: GitHub Pages

on:
  push:
    branches: [A]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-A
  cancel-in-progress: false

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Export Expo static website
        run: npx expo export --platform web

      - name: GitHub Pages extras
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Setup Pages
        if: github.ref == 'refs/heads/A' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/A' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/A' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: export-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # The repo's github-pages environment only allows `main`. That blocks
    # actions/deploy-pages on A even after export succeeds. Deploy without
    # that protected environment so style A can publish without merging.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
